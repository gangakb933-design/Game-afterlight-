<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Afterlight: Recovery</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0c10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            background: #000;
            touch-action: none;
        }
        
        /* Glassmorphism UI Overlays */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            color: #fff;
        }

        /* Modal Screens */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
        }
        .modal-content {
            width: 90%;
            max-width: 480px;
            padding: 24px;
            text-align: center;
            position: relative;
        }
        
        /* Buttons */
        .btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }
        
        /* Custom HUD Elements */
        #hud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #progress-bar-container {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            max-width: 280px;
            height: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #3b82f6);
            transition: width 0.4s ease;
        }
        
        /* Action Button */
        #use-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #3b82f6, #1e40af);
            border: 3px solid rgba(255, 255, 255, 0.8);
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0
                // --- Game Logic ---
    function update() {
        if (isTaskActive) return;

        let moveX = joystick.dx;
        let moveY = joystick.dy;

        if (keys['ArrowLeft'] || keys['a']) moveX = -1;
        if (keys['ArrowRight'] || keys['d']) moveX = 1;
        if (keys['ArrowUp'] || keys['w']) moveY = -1;
        if (keys['ArrowDown'] || keys['s']) moveY = 1;

        if (moveX !== 0 || moveY !== 0) {
            const mag = Math.hypot(moveX, moveY);
            player.vx = (moveX / mag) * player.speed;
            player.vy = (moveY / mag) * player.speed;
            player.angle = Math.atan2(player.vy, player.vx);
            player.idleTimer = 0;

            if (Math.random() < 0.15) {
                footprints.push({ x: player.x, y: player.y, angle: player.angle });
            }
        } else {
            player.vx = 0;
            player.vy = 0;
            player.idleTimer += 0.05;
        }

        let nextX = player.x + player.vx;
        let nextY = player.y + player.vy;

        for (let obs of obstacles) {
            const dist = Math.hypot(nextX - obs.x, nextY - obs.y);
            if (dist < player.radius + obs.radius) {
                const angle = Math.atan2(nextY - obs.y, nextX - obs.x);
                nextX = obs.x + Math.cos(angle) * (player.radius + obs.radius);
                nextY = obs.y + Math.sin(angle) * (player.radius + obs.radius);
            }
        }

        player.x = Math.max(30, Math.min(1500, nextX));
        player.y = Math.max(30, Math.min(1500, nextY));

        drone.x += (player.x - 30 - drone.x) * 0.05;
        drone.y += (player.y - 30 - drone.y) * 0.05;

        const activeChapterRelics = relics.filter(r => r.chapter === currentChapter && !r.recovered);
        let nearRelic = null;

        if (activeChapterRelics.length > 0) {
            const target = activeChapterRelics[0];
            drone.targetAngle = Math.atan2(target.y - drone.y, target.x - drone.x);

            const dist = Math.hypot(player.x - target.x, player.y - target.y);
            if (dist < 60) {
                nearRelic = target;
            }
        }

        const useBtn = document.getElementById('use-btn');
        if (nearRelic) {
            useBtn.classList.add('active');
            activeRelic = nearRelic;
        } else {
            useBtn.classList.remove('active');
            activeRelic = null;
        }

        bonusCards.filter(b => b.chapter === currentChapter && !b.collected).forEach(bonus => {
            if (Math.hypot(player.x - bonus.x, player.y - bonus.y) < 30) {
                bonus.collected = true;
                floatingTexts.push({ x: bonus.x, y: bonus.y, text: '+1 Bonus Card!', alpha: 1.0 });
            }
        });

        floatingTexts.forEach((ft, index) => {
            ft.y -= 0.5;
            ft.alpha -= 0.01;
            if (ft.alpha <= 0) floatingTexts.splice(index, 1);
        });
    }

    // --- Rendering ---
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(CAMERA_SCALE, CAMERA_SCALE);
        ctx.translate(-player.x, -player.y);

        ctx.fillStyle = currentChapter === 1 ? '#1a1d24' : '#2d1810';
        ctx.fillRect(-1000, -1000, 4000, 4000);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        footprints.forEach(fp => {
            ctx.beginPath();
            ctx.arc(fp.x, fp.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });

        obstacles.forEach(obs => {
            ctx.fillStyle = currentChapter === 1 ? '#111318' : '#1f100a';
            ctx.beginPath();
            ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 3;
            ctx.stroke();
        });

        bonusCards.filter(b => b.chapter === currentChapter && !b.collected).forEach(bonus => {
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(bonus.x + Math.sin(Date.now() * 0.005) * 3, bonus.y, 4, 0, Math.PI * 2);
            ctx.fill();
        });

        relics.filter(r => r.chapter === currentChapter).forEach(relic => {
            ctx.save();
            ctx.translate(relic.x, relic.y);

            if (!relic.recovered) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🔒', 0, 0);
            } else {
                ctx.font = '28px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(relic.icon, 0, 0);

                ctx.fillStyle = '#22c55e';
                ctx.beginPath(); ctx.arc(12, -12, 6, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        });

        // --- Animated Cartoon Astronaut ---
        ctx.save();
        
        const isMoving = player.vx !== 0 || player.vy !== 0;
        if (isMoving) {
            player.walkCycle += 0.25;
        } else {
            player.walkCycle = 0;
        }

        const legSwing = isMoving ? Math.sin(player.walkCycle) * 12 : 0;
        const armSwing = isMoving ? Math.sin(player.walkCycle) * 14 : 0;
        const bodyBounce = isMoving ? Math.abs(Math.sin(player.walkCycle * 2)) * 3 : Math.sin(player.idleTimer) * 2;

        ctx.translate(player.x, player.y - bodyBounce);
        ctx.rotate(player.angle + Math.PI / 2);

        const r = 24;

        // Backpack
        ctx.fillStyle = '#cbd5e1';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-8, 4, 16, 16, 4); else ctx.rect(-8, 4, 16, 16);
        ctx.fill(); ctx.stroke();

        // Legs
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;
        
        ctx.save();
        ctx.translate(-6, 14);
        ctx.rotate((-legSwing * Math.PI) / 180);
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-4, 0, 8, 12, 4); else ctx.rect(-4, 0, 8, 12);
        ctx.fill(); ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.translate(6, 14);
        ctx.rotate((legSwing * Math.PI) / 180);
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-4, 0, 8, 12, 4); else ctx.rect(-4, 0, 8, 12);
        ctx.fill(); ctx.stroke();
        ctx.restore();

        // Body
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-12, -2, 24, 20, 10); else ctx.rect(-12, -2, 24, 20);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(-6, 2, 12, 8);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-4, 4, 3, 3);
        ctx.fillStyle = '#3b82f6';
        ctx.fillRect(1, 4, 3, 3);

        // Helmet
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(0, -14, r - 3, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.arc(-r + 2, -14, 4, 0, Math.PI * 2);
        ctx.arc(r - 2, -14, 4, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        // Visor
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.ellipse(0, -14, r - 7, r - 9, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.beginPath(); ctx.arc(4, -17, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.beginPath(); ctx.arc(-3, -11, 1.5, 0, Math.PI * 2); ctx.fill();

        // Arms
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;

        ctx.save();
        ctx.translate(-14, 2);
        ctx.rotate((armSwing * Math.PI) / 180);
        ctx.beginPath(); ctx.arc(0, 8, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.translate(14, 2);
        ctx.rotate((-armSwing * Math.PI) / 180);
        ctx.beginPath(); ctx.arc(0, 8, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();

        ctx.restore();

        // Drone
        ctx.save();
        ctx.translate(drone.x, drone.y);
        ctx.rotate(drone.targetAngle);
        ctx.fillStyle = '#60a5fa';
        ctx.fillRect(-6, -6, 12, 12);
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(14, -4); ctx.lineTo(14, 4); ctx.fill();
        ctx.restore();

        floatingTexts.forEach(ft => {
            ctx.fillStyle = `rgba(245, 158, 11, ${ft.alpha})`;
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText(ft.text, ft.x - 30, ft.y);
        });

        ctx.restore();

        renderMinimap();
    }

    function renderMinimap() {
        const size = 100;
        const margin = 16;
        const x = canvas.width - size - margin;
        const y = margin;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 2;
        ctx.fillRect(x, y, size, size);
        ctx.strokeRect(x, y, size, size);

        const mapScale = size / 1500;
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(x + player.x * mapScale, y + player.y * mapScale, 4, 4);

        relics.filter(r => r.chapter === currentChapter).forEach(r => {
            ctx.fillStyle = r.recovered ? '#22c55e' : '#ef4444';
            ctx.fillRect(x + r.x * mapScale, y + r.y * mapScale, 3, 3);
        });
    }

    function gameLoop() {
        update();
        render();
        requestAnimationFrame(gameLoop);
    }
    gameLoop();

    // --- UI Interactions with Mobile Touch Support ---
    const minigameModal = document.getElementById('minigame-modal');
    const minigameArea = document.getElementById('minigame-area');
    const factModal = document.getElementById('fact-modal');

    const startBtn = document.getElementById('start-chapter-btn');
    const triggerStart = (e) => {
        if (e) e.preventDefault();
        document.getElementById('comic-modal').style.display = 'none';
        isTaskActive = false;
    };
    startBtn.addEventListener('click', triggerStart);
    startBtn.addEventListener('touchend', triggerStart);

    const useBtn = document.getElementById('use-btn');
    const triggerUse = (e) => {
        if (e) e.preventDefault();
        if (!activeRelic) return;
        isTaskActive = true;
        document.getElementById('minigame-title').innerText = activeRelic.name;
        minigameModal.style.display = 'flex';
        loadMiniGame(activeRelic);
    };
    useBtn.addEventListener('click', triggerUse);
    useBtn.addEventListener('touchend', triggerUse);

    function loadMiniGame(relic) {
        minigameArea.innerHTML = '';
        const btn = document.getElementById('minigame-submit');
        btn.style.display = 'inline-block';
        minigameArea.innerHTML = '<p style="color:#aaa;">Complete telemetry alignment to restore unit.</p>';

        const handleComplete = (e) => {
            if (e) e.preventDefault();
            relic.recovered = true;
            minigameModal.style.display = 'none';
            showFactCard(relic);
            updateProgress();
        };
        btn.onclick = handleComplete;
        btn.ontouchend = handleComplete;
    }

    function showFactCard(relic) {
        factModal.style.display = 'flex';
        document.getElementById('fact-relic-name').innerText = relic.name + ' Restored';
        document.getElementById('fact-text').innerText = `Historical Record: ${relic.name} contributed crucial scientific telemetry during its active mission lifecycle.`;
    }

    const factContinueBtn = document.getElementById('fact-continue-btn');
    const handleContinue = (e) => {
        if (e) e.preventDefault();
        factModal.style.display = 'none';
        isTaskActive = false;

        const currentChapterRelics = relics.filter(r => r.chapter === currentChapter);
        if (currentChapterRelics.every(r => r.recovered)) {
            if (currentChapter === 1) {
                currentChapter = 2;
                document.getElementById('comic-title').innerText = 'Chapter 2: Mars';
                document.getElementById('comic-text').innerText = '"Mars keeps its secrets slowly."';
                document.getElementById('comic-modal').style.display = 'flex';
                player.x = 300; player.y = 300;
            } else {
                document.getElementById('certificate-modal').style.display = 'flex';
            }
        }
    };
    factContinueBtn.addEventListener('click', handleContinue);
    factContinueBtn.addEventListener('touchend', handleContinue);

    function updateProgress() {
        const total = relics.length;
        const done = relics.filter(r => r.recovered).length;
        progress = (done / total) * 100;
        document.getElementById('progress-fill').style.width = progress + '%';
    }

    const downloadCertBtn = document.getElementById('download-cert-btn');
    const handleCert = (e) => {
        if (e) e.preventDefault();
        const pName = document.getElementById('player-name').value || 'Astronaut';
        alert(`Certificate issued to ${pName}! Recovery complete.`);
    };
    downloadCertBtn.addEventListener('click', handleCert);
    downloadCertBtn.addEventListener('touchend', handleCert);
</script>
